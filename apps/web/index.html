<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f172a'/><path d='M8 22 16 9l8 13z' fill='none' stroke='%2338bdf8' stroke-width='2.5' stroke-linejoin='round'/></svg>" />
    <title>Taxis – Eventplanung</title>
    <script>
      // Theme vor dem ersten Rendern setzen (kein helles Aufblitzen)
      try {
        var t = localStorage.getItem('taxis-theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
