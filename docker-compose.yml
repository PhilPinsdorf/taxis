services:
  taxis:
    # Fertiges Image aus GitHub Packages; `docker compose up -d --build` baut stattdessen lokal
    image: ghcr.io/philpinsdorf/taxis:latest
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # none = offen, password = gemeinsames Passwort (für öffentliches Hosting empfohlen)
      AUTH_MODE: ${AUTH_MODE:-none}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # true, sobald die App per HTTPS (Reverse-Proxy) erreichbar ist
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - taxis-data:/data
    restart: unless-stopped

volumes:
  taxis-data:
